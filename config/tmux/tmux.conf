# My tmux configuration

## General Settings
set -s escape-time 10                       # Eliminate ESC key delay in Neovim/Vim
set -sg repeat-time 600                     # Milliseconds to repeat prefix-less commands
set -s focus-events on                      # Pass focus events to Neovim

set -g prefix2 C-a                          # Secondary prefix key (Ctrl-A)
set -g mouse on                             # Enable mouse support
set -g history-limit 5000                   # Scrollback history limit

## Compatibility
set -g prediction-dimming off               # Fix glitch when running nvim under psmux

## Display & Windows
set -g base-index 1                         # Start window numbering at 1
setw -g pane-base-index 1                   # Start pane numbering at 1
set -g renumber-windows on                  # Renumber windows when one is closed
set -g set-titles on                        # Update terminal window title
setw -g automatic-rename on                 # Rename window based on active process
set -g default-terminal "tmux-256color"     # Set terminal to 256 colours

## Keybindings

### Reload tmux configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

### Make split panes start from the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

## Vi Copy Mode & Clipboard
setw -g mode-keys vi
set -s set-clipboard on                     # Use OSC 52 to sync system clipboard

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

## Status Bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4" # Subtle dark background with light text
set -g status-left-length 30
set -g status-right-length 50

### Left: Session Name
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "

### Right: Date & Time
set -g status-right "#[fg=#a6adc8] %Y-%m-%d │ %H:%M "

### Active and inactive window styling
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#45475a,fg=#ffffff,bold] #I:#W "
