version = 1

; Default, global settings for all models
[*]
flash-attn = on
n-gpu-layers = all
cache-type-k = q8_0
cache-type-v = q8_0
dedup-cache-models = true
parallel = 1

; chat-template-file vendorised from: https://huggingface.co/google/gemma-4-E4B-it/raw/main/chat_template.jinja
[google/gemma-4-E4B-it]
hf-repo = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
mmproj-url = https://huggingface.co/unsloth/gemma-4-E4B-it-qat-GGUF/resolve/main/mmproj-F16.gguf
chat-template-file = /Users/addianto/.config/llama.cpp/gemma-4-e4b-chat_template.jinja
ctx-size = 65536
ubatch-size = 2048
temperature = 1.0
top-p = 0.95
top-k = 64
spec-type = draft-mtp
spec-draft-n-max = 2
image-min-tokens = 560
image-max-tokens = 1120
parallel = 2
kv-unified = true

[Indexnusrefather/Palette-RP-4B-2609-v0.1]
hf-repo = mradermacher/Palette-RP-4B-2609-v0.1-i1-GGUF:IQ4_XS
ctx-size = 65536
; Temperature, top-p, top-k, min-p, presence-penalty, and repeat-penalty follow the recommendation from Unsloth for Qwen 3.5 (which this finetuned model is based on).
; See: https://unsloth.ai/docs/models/qwen3.5#instruct-non-thinking-mode-settings
temperature = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
; Disable thinking per recommendation by the model's finetuner
; See: https://huggingface.co/Indexnusrefather/Palette-RP-4B-2609-v0.1
reasoning = off

[alibaba/Qwen2.5-Coder-1.5B-Instruct]
hf-repo = bartowski/Qwen2.5-Coder-1.5B-Instruct-abliterated-GGUF:Q6_K
ctx-size = 8192
temperature = 0.7
top-k = 20
top-p = 0.8
repeat-penalty = 1.1

[google/embeddinggemma-2]
hf-repo = unsloth/embeddinggemma-2-GGUF:Q8_0
mmproj-url = https://huggingface.co/unsloth/embeddinggemma-2-GGUF/resolve/main/mmproj-Q8_0.gguf
embedding = true
pooling = mean
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
image-max-tokens = 560

[alibaba/Qwen3-Reranker-0.6B]
hf-repo = mradermacher/Qwen3-Reranker-0.6B-GGUF:Q8_0
reranking = true
pooling = rank
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
